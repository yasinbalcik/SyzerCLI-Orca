name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: node bin/syzer-orca.js --version
      - run: npm test
      - name: Syntax check
        shell: bash
        run: for f in bin/*.js src/*.js scripts/*.js; do node --check "$f"; done
