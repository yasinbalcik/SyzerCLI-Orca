name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run pack
      - name: Checksums
        working-directory: dist
        run: sha256sum syzer-orca-*.tar.gz > SHA256SUMS.txt
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/syzer-orca-$V.tar.gz" dist/SHA256SUMS.txt --title "SyzerCLI-Orca $V" --generate-notes
